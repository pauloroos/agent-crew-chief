<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="t">
  <title id="t">agent-crew-chief</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="chev" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <!-- links from the chief to the crew -->
  <g stroke="#5eead4" stroke-width="6" stroke-linecap="round" opacity="0.9">
    <line x1="104" y1="132" x2="62" y2="190"/>
    <line x1="128" y1="146" x2="128" y2="196"/>
    <line x1="152" y1="132" x2="194" y2="190"/>
  </g>
  <!-- crew: three agents -->
  <circle cx="62" cy="194" r="18" fill="#99f6e4" stroke="#134e4a" stroke-width="5"/>
  <circle cx="128" cy="204" r="18" fill="#99f6e4" stroke="#134e4a" stroke-width="5"/>
  <circle cx="194" cy="194" r="18" fill="#99f6e4" stroke="#134e4a" stroke-width="5"/>
  <!-- the chief: badge with rank chevrons -->
  <circle cx="128" cy="96" r="54" fill="#1e1b4b" stroke="url(#chev)" stroke-width="6"/>
  <g fill="none" stroke="url(#chev)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="100,84 128,64 156,84"/>
    <polyline points="100,106 128,86 156,106"/>
    <polyline points="100,128 128,108 156,128"/>
  </g>
</svg>
