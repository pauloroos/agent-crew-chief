# agent-crew-chief - project preferences.
#
# `install.py` copies this file to docs/crew-chief/preferences.toml only when
# that file does not exist yet, and never touches it afterwards.
#
# An optional global file at ~/.config/agent-crew-chief/preferences.toml is read
# first: scalar keys are overridden one by one (project wins), and the [[tools]]
# and [[models]] tables are merged by `name` / `match` with the project winning.
#
# Uncommented keys override your global file (~/.config/agent-crew-chief/preferences.toml).

# --- coordinator -----------------------------------------------------------

# Tools tried for a paid escalation, best first. A tool that is not listed
# sorts last.
# strong_order = ["my-claude-proxy", "codex", "claude"]

# Chance (0..1) that low-risk work gets a second chance instead of going to the
# best-scoring executor; keeps an unrated or below-median model in the game.
# explore_rate = 0.1

# When true, a model whose rule says `trains = true` counts as `forbidden` and
# is never dispatched.
# forbid_training = false

# fnmatch patterns for paths a brief must never point at, for example
# [".env", "secrets/*"]. dispatch refuses such a brief as `brief_refused`.
# sensitive_paths = []

# Issue tracker used by `close`: none, github, plane, linear or other.
# issue_tracker = "none"

# `close` adds the delivered job to the project CHANGELOG (Keep a Changelog
# style: an entry under `## [Unreleased]`, in `### Added` for feat, `### Fixed`
# for fix, `### Changed` for refactor/perf; docs, tests and chores get none).
# It never touches a released section and adds a job only once.
# "keep-a-changelog" (default) or "none". `close --no-changelog` skips it once.
# changelog = "keep-a-changelog"

# The CHANGELOG file, relative to the project root.
# changelog_path = "CHANGELOG.md"

# How much Ponytail (vendor/ponytail) goes into every brief. Ponytail is the
# "lazy senior dev" rules: the smallest change that fully solves the task.
# - lite:  build what was asked; name a smaller option in one line.
# - full:  the smallest complete change (the default).
# - ultra: also question the request and push back on what the need does not
#          justify. Can make a cheap model argue instead of building.
# - off:   no Ponytail rules; the brief is unchanged.
# ponytail_level = "full"

# rtk command-prefix mode for test and git commands in briefs:
# - auto: active if rtk binary is found on PATH (default).
# - on:   always active; warns once if rtk binary is missing.
# - off:  disabled, no prefix instructions.
# rtk = "auto"

# Superpowers skill injection for executor briefs:
# - off:  no superpowers skills injected (default).
# - auto: automatically select skill by work type (code/tests -> test-driven-development,
#         diagnosis/bug -> systematic-debugging, docs/rename -> off).
# - <skill>: specific skill name (test-driven-development, systematic-debugging,
#            verification-before-completion).
# superpowers = "off"

# Hard limit for one dispatch attempt, in seconds. On overrun the process tree
# is killed and the attempt is recorded as `timeout`.
# dispatch_timeout_s = 900

# Executor id used for reviews when the coordinator has no better idea, for
# example "codex:gpt-5-codex". Empty means "choose one yourself".
# review_default = ""

# Hours between automatic checks for new, gone or re-priced models. `discover`
# and `job new` always check; `pick` and `dispatch` check (and update
# docs/crew-chief/models-seen.json) only when the last check is this old.
# 0 means every time.
# model_check_hours = 24

# Minutes an executor stays out of `pick` after an attempt ended in `quota`, in
# any job of this project, with every executor of its quota family (the same
# model at any effort; on Antigravity, the whole vendor: antigravity:claude,
# antigravity:gemini, ...). With every free executor cooling down, `pick`
# escalates thinking work to the paid ones; hands-on work gets no executor.
# quota_cooldown_min = 60

# Economy alerts printed by `economy` and `close` (0 turns an alert off). They
# answer "did the free work really save paid tokens, rework and time?":
# - coordinator share: the coordinator's own tokens, as a share
#   of every token the job spent, above which `close` warns;
# - attempts per piece: execution attempts divided by pieces tried;
# - job minutes: from the job's creation to its last finished attempt.
# alert_coordinator_share = 0.5
# alert_attempts_per_piece = 2.5
# alert_job_minutes = 180

# Paid-by-use spending limits, in US dollars. `cheap` models are used only while
# the day's spend across every project is under cheap_budget_usd_day; 0 keeps
# the cheap tier closed ("run setup to allow cheap models"). cheap_budget_usd_job
# (0 = no job ceiling) caps a single job. One attempt can go over the daily
# ceiling by at most its own cost, since the check runs before the attempt.
# cheap_budget_usd_day = 2
# cheap_budget_usd_job = 1

# Tools whose free executors `pick` tries first on hands-on work (code, tests,
# refactor, docs, data), before any other free executor. Hands-on work never
# goes to a paid executor unless the coordinator passes `--strong`; thinking
# work (review, design, diagnosis, research) goes to any free executor and
# escalates to `strong_order` when needed. [] turns the preference off.
# exec_first = ["opencode"]

# Extra top-level entries of your home directory that the containment check
# ignores (fnmatch patterns), for agent CLIs that keep their config there. They
# add to the built-in list (.claude, .claude.json*, .codex, .gemini,
# .antigravity*, .opencode, .local, .config, .cache, .cursor, ...; see
# AGENT_HOME_ENTRIES in scripts/crew_chief/worktree.py). Global and project
# lists add up.
# ignore_home_entries = [".aider*", ".kiro"]

# --- coordinators ------------------------------------------------------------
#
# `acc launch` tries the coordinators of [team].coordinators in order, as
# "tool:model" entries of any configured tool; on a quota or a failure the
# next one takes over the same worktree and job. One round may run this long:
# coordinator_timeout_s = 14400
#
# [team]
# coordinators = ["opencode:omni/chefe", "claude:opus", "codex:gpt-6.1-sol"]
#
# --- executor choice (Phase 4) ---------------------------------------------
#
# Default executor mode when no `--executors` CLI flag or stored job record
# supplies one. One of:
#   "own"        coordinator's own CLI and its included tool family;
#   "subagents"  coordinator's native subagents in this session;
#   "free_first" free external executors first (the legacy default);
#   "ask"        ask the owner once at job start (interactive coordinators),
#                falling back to "free_first" in non-interactive environments.
# Precedence: explicit CLI option > stored job record > this preference > "ask".
# When resolved to "ask", an interactive coordinator asks exactly one question
# at job start and records the answer via `job set --executors`; a
# non-interactive coordinator falls back to "free_first" and records that it
# did. BOM/CRLF handling follows existing preferences parsing.
# executors_default = "ask"

# --- models ----------------------------------------------------------------
#
# `match` is an fnmatch glob tested against the executor id "<tool>:<model>".
# The first matching rule wins. `cost` is free, included, cheap, paid or
# forbidden; `trains` says whether the provider may train on what you send it.
# `included` means a subscription you already pay for (a Codex or Claude plan,
# promoted by `acc setup`); `cheap` is pay per use, used only within the
# budget. `cap_usd_day` (optional) caps what one executor may spend per day and
# also lets an executor whose cost is unknown in, up to that cap. A model
# matched by no rule is `paid`.

# Preview and contributor models are free but may train on your traffic; these
# two rules must stay before the generic ones below, because the first match
# wins and the trains flag would otherwise be missed.
[[models]]
match = "*-preview-free"
cost = "free"
trains = true

[[models]]
match = "*contributor*"
cost = "free"
trains = true

[[models]]
match = "opencode:opencode/*-free"
cost = "free"

[[models]]
match = "opencode:opencode-go/*-free"
cost = "free"

[[models]]
match = "antigravity:*"
cost = "free"

# A subscription you pay for, promoted by `acc setup` when it detects the plan:
# [[models]]
# match = "codex:*"
# cost = "included"

# A pay-per-use model with a daily cap (also lets an unknown-cost model in):
# [[models]]
# match = "opencode:openrouter/*"
# cost = "cheap"
# cap_usd_day = 1

# --- tools -----------------------------------------------------------------
#
# A tool is one executor CLI on PATH. Keys:
#   name         unique name, also the prefix of the executor id
#   kind         claude-code, opencode, codex, antigravity or generic
#   bin          executable to run (looked up on PATH)
#   models       fixed list of model ids the tool accepts; empty means "ask the
#                tool" with `<bin> models` (kinds claude-code and codex always
#                use this fixed list)
#   effort       whether the tool takes an effort/reasoning flag (default:
#                true for codex and antigravity, false otherwise)
#   env          environment variable names the tool needs; a name missing from
#                the environment is read from HKCU\Environment on Windows
#   cost_default classifies a model that no [[models]] rule matched
#   run_cmd      argv template for kind "generic"; the placeholders {worktree},
#                {model}, {prompt}, {brief_file} and {output_file} are filled in
#   list_cmd     argv that prints one model id per line, for kind "generic"
#   work_types   work types `pick` may give this tool, from: code, tests,
#                refactor, design, docs, research, diagnosis, data, review.
#                Missing or empty means every type (the default for every
#                kind); an unknown type is a configuration error.
#
# The default tools (opencode, antigravity, codex, claude, cursor) are always
# present; an entry here replaces the default with the same `name`.

# A Claude-Code-like CLI behind a third-party API key:
# [[tools]]
# name = "my-claude-proxy"
# kind = "claude-code"
# bin = "my-claude-proxy"
# models = ["<model-id>"]
# effort = false
# env = ["MY_PROXY_API_KEY"]
# cost_default = "paid"
# work_types = ["review", "design", "diagnosis", "research"]  # thinking only

# Any CLI, driven by its own command line:
# [[tools]]
# name = "my-generic-cli"
# kind = "generic"
# bin = "my-generic-cli"
# run_cmd = ["my-generic-cli", "run", "--model", "{model}", "{prompt}"]
# list_cmd = ["my-generic-cli", "models"]
